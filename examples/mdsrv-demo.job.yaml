version: mdsrv.job/v1
metadata:
  id: demo
  name: MDsrv demo trajectory
  description: Tiny synthetic trajectory generated by `hlmdsrv demo create`.
  created_by: hlmdsrv example
inputs:
  topology:
    path: raw/structure.gro
    format: gro
  trajectories:
    - path: raw/trajectory.xtc
      format: xtc
      time_unit: ps
      coordinate_unit: nm
selections:
  - id: first-two
    expression: "1-2"
    kind: atom-index
streaming:
  encoding: json
  chunk_size_frames: 2
  materialize_chunks: true
analyses:
  - id: d12
    type: distance
    selections:
      a: "1"
      b: "2"
    output: traces/d12.csv
visualization:
  mvs:
    scene: visualization/demo.mvsj
  camera:
    focus: first-two
outputs:
  - type: mdsrvx
    path: demo.mdsrvx
