name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Not pinned to the go.mod floor (1.22): the Go 1.22 linker emits Mach-O
      # binaries without an LC_UUID load command, which dyld on current macOS
      # arm64 runners rejects with "abort trap" before any test runs. The floor
      # itself is still guarded by the go-floor job below.
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Verify frozen JSON contracts
        run: ./scripts/verify-mdsrv-contracts.sh

  # Guards the `go 1.22` directive in go.mod: the module must still compile on
  # its declared minimum. Linux only, where the 1.22 toolchain is healthy.
  go-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go build ./...
      - run: go test ./...

  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      # docs/cli and completions are generated from the binary. Regenerate and
      # fail if the checked-in copies drifted.
      - name: Regenerate CLI assets
        run: |
          go build -o bin/hlmdsrv ./cmd/hlmdsrv
          bin/hlmdsrv docs --out docs/cli >/dev/null
          perl -0pi -e 's/\n+\z/\n/' docs/cli/*.md
          bin/hlmdsrv completion bash --out completions/hlmdsrv.bash --force >/dev/null
          bin/hlmdsrv completion zsh  --out completions/_hlmdsrv     --force >/dev/null
          bin/hlmdsrv completion fish --out completions/hlmdsrv.fish --force >/dev/null
      - name: Check for drift
        run: git diff --exit-code -- docs/cli completions

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hlmdsrv:ci .
      - run: docker run --rm hlmdsrv:ci doctor --json
